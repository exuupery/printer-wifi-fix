<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t d">
  <title id="t">Printer Wi-Fi Fix</title>
  <desc id="d">Сетевой принтер печатает сразу, а не через несколько минут</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset=".55" stop-color="#0c3157"/>
      <stop offset="1" stop-color="#0b5a55"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".42"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b6f0d0"/>
    </linearGradient>
    <clipPath id="card"><rect width="840" height="200" rx="16"/></clipPath>
    <clipPath id="tray"><rect x="86" y="136" width="48" height="46"/></clipPath>
  </defs>

  <style>
    /* Без анимации виден готовый кадр: всё на месте, лист напечатан. */
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }

    .up { animation: up .9s ease-out backwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .4s; }
    .d3 { animation-delay: .65s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px) } }

    .glow1 { animation: drift1 11s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 13s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(-46px, 26px) } }
    @keyframes drift2 { to { transform: translate(54px, -22px) } }

    .echo { fill: none; stroke: #fff; stroke-width: 2; opacity: .06; animation: echo 4.2s ease-in-out infinite; }
    .e2 { animation-delay: .5s; }
    .e3 { animation-delay: 1s; }
    .e4 { animation-delay: 1.5s; }
    @keyframes echo { 50% { opacity: .17 } }

    .wifi { fill: none; stroke: #7ee787; stroke-width: 4; stroke-linecap: round; animation: wifi 2.1s ease-in-out infinite; }
    .w2 { animation-delay: .3s; }
    .w3 { animation-delay: .6s; }
    @keyframes wifi { 0%, 100% { opacity: .25 } 30%, 60% { opacity: 1 } }

    .led { fill: #7ee787; animation: led 1.2s ease-in-out infinite; }
    @keyframes led { 50% { opacity: .35 } }

    .page { animation: print 3.6s ease-out infinite; }
    @keyframes print {
      0%        { transform: translateY(-34px); opacity: 1 }
      45%, 80%  { transform: translateY(0); opacity: 1 }
      95%, 100% { transform: translateY(0); opacity: 0 }
    }

    .signal { fill: #7ee787; animation: run 2.8s ease-in-out infinite; }
    @keyframes run {
      0%   { transform: translateX(0); opacity: 0 }
      12%  { opacity: 1 }
      88%  { opacity: 1 }
      100% { transform: translateX(442px); opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="200" fill="url(#bg)"/>
    <circle class="glow1" cx="700" cy="20" r="170" fill="url(#glowA)"/>
    <circle class="glow2" cx="520" cy="230" r="150" fill="url(#glowB)"/>

    <!-- Эхо сигнала в углу -->
    <circle class="echo" cx="790" cy="232" r="70"/>
    <circle class="echo e2" cx="790" cy="232" r="120"/>
    <circle class="echo e3" cx="790" cy="232" r="170"/>
    <circle class="echo e4" cx="790" cy="232" r="220"/>
  </g>
  <rect x=".5" y=".5" width="839" height="199" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <!-- Логотип: принтер с сигналом Wi-Fi -->
  <g class="up">
    <circle cx="110" cy="90" r="3.5" fill="#7ee787"/>
    <path class="wifi" d="M100.8 80.8A13 13 0 0 1 119.2 80.8"/>
    <path class="wifi w2" d="M93 73A24 24 0 0 1 127 73"/>
    <path class="wifi w3" d="M85.3 65.3A35 35 0 0 1 134.7 65.3"/>

    <rect x="93" y="100" width="34" height="14" rx="3" fill="#ffffff" fill-opacity=".12" stroke="#fff" stroke-width="3"/>
    <rect x="74" y="112" width="72" height="32" rx="8" fill="#12385c" stroke="#fff" stroke-width="3"/>
    <circle class="led" cx="134" cy="122" r="3"/>
    <path d="M88 134H132" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <g clip-path="url(#tray)">
      <g class="page">
        <rect x="93" y="137" width="34" height="30" rx="2" fill="#fff"/>
        <path d="M99 147h22M99 154h22M99 161h14" stroke="#9fb3c8" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <text class="up d1" x="196" y="102" font-size="46" font-weight="800" letter-spacing="-.5" fill="url(#title)">Printer Wi-Fi Fix</text>
  <text class="up d2" x="198" y="134" font-size="18" fill="#d7ecff">Сетевой принтер печатает сразу, а не через несколько минут</text>

  <g class="up d3">
    <path d="M198 156H640" stroke="#fff" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <circle class="signal" cx="198" cy="156" r="3.5"/>
  </g>

  <text class="up d3" x="812" y="34" text-anchor="end" font-size="12" font-weight="600" letter-spacing="1.2" fill="#fff" fill-opacity=".55">WINDOWS · POWERSHELL 5.1</text>
</svg>
