<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="t d">
  <title id="t">Было и стало</title>
  <desc id="d">Было: компьютер ищет принтер по имени через DNS, LLMNR и mDNS, ответ теряется, печать ждёт минутами. Стало: задание идёт напрямую по IP на порт 9100 за миллисекунды, принтер печатает сразу.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--bg1)"/>
      <stop offset="1" style="stop-color:var(--bg2)"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" style="fill:var(--dot)"/>
    </pattern>
    <clipPath id="out"><rect x="684" y="176" width="82" height="70"/></clipPath>
  </defs>

  <style>
    /* Цикл 12 с: 0-50% "было", 50-100% "стало". Без анимации виден итоговый кадр "стало".
       Цвета - через переменные: светлая палитра по умолчанию, тёмная - по prefers-color-scheme. */
    :root {
      --bg1: #ffffff; --bg2: #f6f8fa; --border: #d0d7de; --dot: #e7ebef;
      --fg: #1f2328; --muted: #656d76;
      --dev: #eaeef2; --dev2: #d8dee4; --dev-line: #8c959f; --screen: #24292f;
      --red: #cf222e; --red-bg: #ffebe9; --green: #1a7f37; --green-bg: #dafbe1;
      --blue: #0969da; --pill: #ffffff; --pill-text: #0969da;
      --sheet: #ffffff; --sheet-line: #8c959f; --trail: #afb8c1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #0d1117; --bg2: #161b22; --border: #30363d; --dot: #21262d;
        --fg: #e6edf3; --muted: #8b949e;
        --dev: #21262d; --dev2: #30363d; --dev-line: #484f58; --screen: #0d1117;
        --red: #ff7b72; --red-bg: #3c1618; --green: #3fb950; --green-bg: #12261e;
        --blue: #58a6ff; --pill: #161b22; --pill-text: #79c0ff;
        --sheet: #e6edf3; --sheet-line: #8b949e; --trail: #484f58;
      }
    }

    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; }
    .fg { fill: var(--fg); }
    .mut { fill: var(--muted); }
    .red { fill: var(--red); }
    .grn { fill: var(--green); }

    .a { opacity: 0; animation: a 12s linear infinite; }
    .b { opacity: 1; animation: b 12s linear infinite; }
    @keyframes a { 0% { opacity: 0 } 2%, 46% { opacity: 1 } 49%, 100% { opacity: 0 } }
    @keyframes b { 0%, 50% { opacity: 0 } 53%, 96% { opacity: 1 } 100% { opacity: 0 } }

    @keyframes spin { to { transform: rotate(360deg) } }
    .spin { fill: none; stroke: #58a6ff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 42 28;
            transform-origin: 115px 151px; animation: spin 1s linear infinite; }
    .hand { stroke: var(--red); stroke-width: 2; stroke-linecap: round;
            transform-origin: 792px 43px; animation: spin 1.5s linear infinite; }

    /* Было: широковещательный поиск */
    .ring { fill: none; stroke: var(--blue); stroke-width: 1.5; vector-effect: non-scaling-stroke; opacity: 0;
            transform-origin: 185px 160px; animation: ring 2.4s ease-out infinite; }
    .r2 { animation-delay: 1.2s; }
    @keyframes ring { 0% { transform: scale(.3); opacity: .55 } 100% { transform: scale(5); opacity: 0 } }

    .trail { fill: none; stroke: var(--trail); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 2 8; animation: march 1s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -10 } }

    .sheet { fill: var(--sheet); stroke: var(--blue); stroke-width: 1.5; }
    .ln { fill: none; stroke: var(--sheet-line); stroke-width: 1.6; stroke-linecap: round; }

    .pA { opacity: 0; animation: pA 12s ease-in-out infinite; }
    @keyframes pA {
      0%, 2%    { transform: translate(185px, 160px); opacity: 0 }
      3.5%      { transform: translate(185px, 160px); opacity: 1 }
      9%, 13%   { transform: translate(270px, 122px); opacity: 1 }
      19%, 24%  { transform: translate(380px, 198px) }
      30%, 34%  { transform: translate(490px, 122px) }
      39%       { transform: translate(590px, 165px) }
      40.2%     { transform: translate(584px, 165px) }
      41.4%     { transform: translate(596px, 165px) }
      42.6%     { transform: translate(585px, 165px) }
      43.8%     { transform: translate(590px, 165px); opacity: 1 }
      47%, 100% { transform: translate(590px, 176px); opacity: 0 }
    }
    .pA .sheet { animation: pAfill 12s linear infinite; }
    @keyframes pAfill { 0%, 35% { fill: var(--sheet); stroke: var(--blue) } 40%, 100% { fill: var(--red-bg); stroke: var(--red) } }
    .pA .ln { animation: pAln 12s linear infinite; }
    @keyframes pAln { 0%, 38% { opacity: 1 } 40%, 100% { opacity: 0 } }
    .pA .x { fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linecap: round; opacity: 0;
             animation: pAx 12s linear infinite; }
    @keyframes pAx { 0%, 38% { opacity: 0 } 40%, 100% { opacity: 1 } }

    .q { opacity: 0; }
    .q rect { fill: var(--pill); stroke: var(--blue); }
    .q text { fill: var(--pill-text); }
    .err rect { fill: var(--red-bg); stroke: var(--red); }
    .err text { fill: var(--red); }
    .q1 { animation: q1 12s linear infinite; }
    .q2 { animation: q2 12s linear infinite; }
    .q3 { animation: q3 12s linear infinite; }
    .err { animation: err 12s linear infinite; }
    @keyframes q1  { 0%, 8%  { opacity: 0 } 10%, 100% { opacity: 1 } }
    @keyframes q2  { 0%, 18% { opacity: 0 } 20%, 100% { opacity: 1 } }
    @keyframes q3  { 0%, 29% { opacity: 0 } 31%, 100% { opacity: 1 } }
    @keyframes err { 0%, 38% { opacity: 0 } 40%, 100% { opacity: 1 } }

    /* Стало: прямое подключение */
    .wire { stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 477;
            animation: wire 12s ease-out infinite; }
    .glow { stroke: var(--green); stroke-width: 11; stroke-linecap: round; stroke-dasharray: 477; opacity: .16;
            animation: wire 12s ease-out infinite; }
    @keyframes wire { 0%, 51% { stroke-dashoffset: 477 } 57%, 100% { stroke-dashoffset: 0 } }

    .lbl { animation: lbl 12s linear infinite; }
    @keyframes lbl { 0%, 56% { opacity: 0 } 59%, 100% { opacity: 1 } }

    .pB { opacity: 0; }
    .pB .sheet { stroke: var(--green); }
    .streak { fill: var(--green); opacity: .55; }
    .pB1 { animation: pB1 12s cubic-bezier(.45, 0, .2, 1) infinite; }
    .pB2 { animation: pB2 12s cubic-bezier(.45, 0, .2, 1) infinite; }
    .pB3 { animation: pB3 12s cubic-bezier(.45, 0, .2, 1) infinite; }
    @keyframes pB1 {
      0%, 59%     { transform: translate(185px, 160px); opacity: 0 }
      59.6%       { transform: translate(185px, 160px); opacity: 1 }
      63%         { transform: translate(652px, 160px); opacity: 1 }
      63.8%, 100% { transform: translate(668px, 160px); opacity: 0 }
    }
    @keyframes pB2 {
      0%, 71%     { transform: translate(185px, 160px); opacity: 0 }
      71.6%       { transform: translate(185px, 160px); opacity: 1 }
      75%         { transform: translate(652px, 160px); opacity: 1 }
      75.8%, 100% { transform: translate(668px, 160px); opacity: 0 }
    }
    @keyframes pB3 {
      0%, 83%     { transform: translate(185px, 160px); opacity: 0 }
      83.6%       { transform: translate(185px, 160px); opacity: 1 }
      87%         { transform: translate(652px, 160px); opacity: 1 }
      87.8%, 100% { transform: translate(668px, 160px); opacity: 0 }
    }

    .page rect { fill: var(--sheet); stroke: var(--sheet-line); }
    .page path { stroke: var(--sheet-line); stroke-width: 2; stroke-linecap: round; }
    .pp1 { animation: pp1 12s ease-out infinite; }
    .pp2 { animation: pp2 12s ease-out infinite; }
    .pp3 { animation: pp3 12s ease-out infinite; }
    @keyframes pp1 { 0%, 63% { transform: translateY(-52px) } 68%, 100% { transform: translateY(0) } }
    @keyframes pp2 { 0%, 75% { transform: translateY(-52px) } 80%, 100% { transform: translateY(0) } }
    @keyframes pp3 { 0%, 87% { transform: translateY(-52px) } 92%, 100% { transform: translateY(0) } }

    .ok { animation: ok 12s linear infinite; }
    @keyframes ok { 0%, 66% { opacity: 0 } 68.5%, 100% { opacity: 1 } }

    .led { fill: var(--green); animation: led 12s linear infinite; }
    @keyframes led { 0%, 52% { fill: #6e7681 } 55%, 100% { fill: var(--green) } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Фон -->
  <rect x=".5" y=".5" width="839" height="299" rx="14" fill="url(#bg)" style="stroke:var(--border)"/>
  <rect x=".5" y=".5" width="839" height="299" rx="14" fill="url(#dots)"/>

  <!-- Было: волны широковещательного поиска (под компьютером) -->
  <g class="a">
    <circle class="ring" cx="185" cy="160" r="20"/>
    <circle class="ring r2" cx="185" cy="160" r="20"/>
  </g>

  <!-- Компьютер -->
  <rect x="60" y="112" width="110" height="78" rx="9" stroke-width="1.5" style="fill:var(--dev);stroke:var(--dev-line)"/>
  <rect x="68" y="120" width="94" height="62" rx="4" style="fill:var(--screen)"/>
  <rect x="107" y="190" width="16" height="12" style="fill:var(--dev2)"/>
  <rect x="86" y="202" width="58" height="6" rx="3" style="fill:var(--dev-line)"/>
  <text class="mut" x="115" y="246" text-anchor="middle" font-size="13">компьютер</text>

  <!-- Принтер -->
  <rect x="703" y="104" width="44" height="30" rx="2" style="fill:var(--sheet);stroke:var(--sheet-line)"/>
  <path d="M697 138v-20a4 4 0 0 1 4-4h48a4 4 0 0 1 4 4v20z" stroke-width="1.5" style="fill:var(--dev);stroke:var(--dev-line)"/>
  <rect x="670" y="138" width="110" height="52" rx="9" stroke-width="1.5" style="fill:var(--dev2);stroke:var(--dev-line)"/>
  <rect x="682" y="150" width="46" height="6" rx="3" style="fill:var(--dev-line)"/>
  <circle class="led" cx="764" cy="153" r="4"/>
  <rect x="684" y="172" width="82" height="7" rx="3.5" style="fill:var(--screen)"/>
  <text class="mut" x="725" y="246" text-anchor="middle" font-size="13">принтер</text>

  <!-- ===== БЫЛО ===== -->
  <g class="a">
    <rect x="32" y="30" width="64" height="26" rx="13" style="fill:var(--red-bg);stroke:var(--red)"/>
    <text class="red" x="64" y="47.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1">БЫЛО</text>
    <text class="fg" x="108" y="49" font-size="16" font-weight="600">Windows ищет принтер по имени</text>

    <text class="red" x="770" y="50" text-anchor="end" font-size="20" font-weight="700">ждём минуты</text>
    <circle cx="792" cy="43" r="11" fill="none" stroke-width="2" style="stroke:var(--red)"/>
    <path d="M792 43h6" stroke-width="2" stroke-linecap="round" style="stroke:var(--red)"/>
    <path class="hand" d="M792 43v-7"/>

    <circle class="spin" cx="115" cy="151" r="11"/>

    <path class="trail" d="M185 160L270 122 380 198 490 122 590 165"/>

    <g class="q q1">
      <rect x="241" y="78" width="58" height="24" rx="12"/>
      <text class="mono" x="270" y="94.5" text-anchor="middle" font-size="13">DNS?</text>
    </g>
    <g class="q q2">
      <rect x="342" y="220" width="76" height="24" rx="12"/>
      <text class="mono" x="380" y="236.5" text-anchor="middle" font-size="13">LLMNR?</text>
    </g>
    <g class="q q3">
      <rect x="457" y="78" width="66" height="24" rx="12"/>
      <text class="mono" x="490" y="94.5" text-anchor="middle" font-size="13">mDNS?</text>
    </g>
    <g class="q err">
      <rect x="536" y="198" width="108" height="24" rx="12"/>
      <text x="590" y="214.5" text-anchor="middle" font-size="13" font-weight="600">нет ответа</text>
    </g>

    <g class="pA">
      <rect class="sheet" x="-11" y="-14" width="22" height="28" rx="3"/>
      <path class="ln" d="M-6 -6h12M-6 0h12M-6 6h7"/>
      <path class="x" d="M-5 -5l10 10M5 -5l-10 10"/>
    </g>

    <text class="mut" x="420" y="278" text-anchor="middle" font-size="13">секунды на поиск имени · ответ по Wi-Fi потерялся → повтор через минуты</text>
  </g>

  <!-- ===== СТАЛО ===== -->
  <g class="b">
    <rect x="32" y="30" width="72" height="26" rx="13" style="fill:var(--green-bg);stroke:var(--green)"/>
    <text class="grn" x="68" y="47.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1">СТАЛО</text>
    <text class="fg" x="116" y="49" font-size="16" font-weight="600">Печать напрямую по IP</text>

    <text class="grn" x="770" y="50" text-anchor="end" font-size="20" font-weight="700">сразу</text>
    <path class="grn" d="M795 30l-11 15h7l-3 12 12-16h-7z"/>

    <path d="M104 151l8 8 15-17" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <line class="glow" x1="185" y1="160" x2="662" y2="160"/>
    <line class="wire" x1="185" y1="160" x2="662" y2="160"/>

    <g class="lbl">
      <rect x="368" y="112" width="104" height="26" rx="13" style="fill:var(--bg1);stroke:var(--green)"/>
      <text class="mono grn" x="420" y="129.5" text-anchor="middle" font-size="13" font-weight="600">IP : 9100</text>
      <text class="fg" x="420" y="194" text-anchor="middle" font-size="14" font-weight="600">миллисекунды</text>
    </g>

    <g class="pB pB1">
      <rect class="streak" x="-58" y="-3" width="44" height="6" rx="3"/>
      <rect class="sheet" x="-11" y="-14" width="22" height="28" rx="3"/>
      <path class="ln" d="M-6 -6h12M-6 0h12M-6 6h7"/>
    </g>
    <g class="pB pB2">
      <rect class="streak" x="-58" y="-3" width="44" height="6" rx="3"/>
      <rect class="sheet" x="-11" y="-14" width="22" height="28" rx="3"/>
      <path class="ln" d="M-6 -6h12M-6 0h12M-6 6h7"/>
    </g>
    <g class="pB pB3">
      <rect class="streak" x="-58" y="-3" width="44" height="6" rx="3"/>
      <rect class="sheet" x="-11" y="-14" width="22" height="28" rx="3"/>
      <path class="ln" d="M-6 -6h12M-6 0h12M-6 6h7"/>
    </g>

    <!-- Листы выезжают из принтера -->
    <g clip-path="url(#out)">
      <g transform="translate(-5 0)"><g class="page pp1">
        <rect x="695" y="178" width="60" height="44" rx="2"/>
        <path d="M703 190h44M703 198h44M703 206h28"/>
      </g></g>
      <g transform="translate(0 2)"><g class="page pp2">
        <rect x="695" y="178" width="60" height="44" rx="2"/>
        <path d="M703 190h44M703 198h44M703 206h28"/>
      </g></g>
      <g transform="translate(5 4)"><g class="page pp3">
        <rect x="695" y="178" width="60" height="44" rx="2"/>
        <path d="M703 190h44M703 198h44M703 206h28"/>
      </g></g>
    </g>

    <g class="ok">
      <circle cx="782" cy="136" r="11" stroke-width="2" style="fill:var(--green);stroke:var(--bg1)"/>
      <path d="M777 136l4 4 7-8" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--bg1)"/>
    </g>

    <text class="mut" x="420" y="278" text-anchor="middle" font-size="13">RAW 9100 · драйвер производителя · одна очередь вместо дублей</text>
  </g>
</svg>
