<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 448" width="840" height="448" role="img" aria-labelledby="t d">
  <title id="t">Как выглядит запуск</title>
  <desc id="d">Иллюстрация: мастер находит принтер по адресу 192.168.1.50, показывает план — одну очередь оставить и перевести на IP, дубль удалить, очередь со сканером не трогать — и после подтверждения делает резервную копию и исправляет очереди.</desc>

  <style>
    /* Цикл 20 с: команда печатается, затем строки вывода открываются по одной.
       Без анимации обе "шторки" убраны и виден весь вывод. Адреса и имена - выдуманные. */
    .ui { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .t { font-family: ui-monospace, 'Cascadia Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;
         font-size: 13px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .hi  { fill: #f0f6fc; font-weight: 700; }
    .cy  { fill: #39c5cf; }
    .ok  { fill: #3fb950; }
    .wr  { fill: #d29922; }
    .done { fill: #56d364; font-weight: 700; }

    /* Шторка вывода: сжимается к низу по одной строке (19 строк по 19 px) */
    .curtain { fill: #0d1117; transform: scaleY(0); transform-origin: 0 432px;
               animation: reveal 20s steps(19, end) infinite; }
    @keyframes reveal { 0%, 14% { transform: scaleY(1) } 80%, 100% { transform: scaleY(0) } }

    /* Шторка команды: открывает по одному символу (19 символов) */
    .typing { fill: #0d1117; transform: scaleX(0); transform-origin: 350px 0;
              animation: typing 20s steps(19, end) infinite; }
    @keyframes typing { 0%, 4% { transform: scaleX(1) } 11%, 100% { transform: scaleX(0) } }

    .caret { fill: #c9d1d9; opacity: 0; animation: caret 20s steps(19, end) infinite; }
    @keyframes caret {
      0%, 4%    { transform: translateX(0); opacity: 1 }
      11%       { transform: translateX(148px); opacity: 1 }
      13%, 100% { transform: translateX(148px); opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Окно -->
  <rect x=".5" y=".5" width="839" height="447" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 36V13A12 12 0 0 1 13 1h814a12 12 0 0 1 12 12v23z" fill="#161b22"/>
  <path d="M1 36.5h838" stroke="#30363d"/>
  <circle cx="22" cy="18.5" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18.5" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18.5" r="6" fill="#28c840"/>
  <text class="ui" x="420" y="23" text-anchor="middle" font-size="12.5" fill="#8b949e">Fix-PrinterWiFi.cmd — иллюстрация, адреса и имена выдуманные</text>

  <!-- Строка 1: приглашение и команда -->
  <text class="t dim" x="24" y="66" textLength="164" lengthAdjust="spacingAndGlyphs">C:\Printer Wi-Fi Fix&gt;</text>
  <text class="t hi" x="198" y="66" textLength="148" lengthAdjust="spacingAndGlyphs">Fix-PrinterWiFi.cmd</text>
  <rect class="typing" x="198" y="52" width="152" height="19"/>
  <rect class="caret" x="198" y="54" width="8" height="15"/>

  <!-- Вывод -->
  <text class="t cy" x="24" y="104">=== Настройка: какой принтер исправляем ===</text>
  <text class="t hi" x="40" y="123">[1] 192.168.1.50</text>
  <text class="t dim" x="79" y="142">'Офисный принтер 0001' (Драйвер производителя, TCP/IP)</text>
  <text class="t dim" x="79" y="161">'PRINTER-1A2B3C (модель)' (Microsoft IPP Class Driver, WSD)</text>
  <text class="t" x="24" y="180">Номер принтера (1-1) или его IP-адрес: <tspan class="hi">1</tspan></text>
  <text class="t ok" x="40" y="199">[OK] Принтер 192.168.1.50 отвечает за 4 мс, MAC AA-BB-CC-DD-EE-FF</text>

  <text class="t cy" x="24" y="237">=== 2. Анализ очередей ===</text>
  <text class="t" x="79" y="256">Оставить: 'Офисный принтер 0001' -&gt; 'Офисный принтер (Wi-Fi)' на IP_192.168.1.50</text>
  <text class="t" x="79" y="275">Удалить: 'Офисный принтер 0002' - порт на имя хоста принтера</text>
  <text class="t wr" x="40" y="294">[!] Оставлена 'PRINTER-1A2B3C (модель)': вместе с ней Windows удалит сетевой сканер</text>
  <text class="t" x="24" y="313">Выполнить этот план? [Д/н]: <tspan class="hi">д</tspan></text>

  <text class="t ok" x="40" y="351">[OK] Бэкап: C:\ProgramData\PrinterWiFiFix\printers-before_PC-01_20261005.printerExport</text>
  <text class="t ok" x="40" y="370">[OK] Порт создан</text>
  <text class="t ok" x="40" y="389">[OK] Переименована в 'Офисный принтер (Wi-Fi)'</text>
  <text class="t ok" x="40" y="408">[OK] Удалена 'Офисный принтер 0002'</text>
  <text class="t done" x="24" y="427">Готово. Печатайте на 'Офисный принтер (Wi-Fi)'.</text>

  <rect class="curtain" x="2" y="71" width="836" height="361"/>
</svg>
