<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 372" width="840" height="372" role="img" aria-labelledby="t d">
  <title id="t">Что скрипт сделает с очередями</title>
  <desc id="d">Скрипт проходит по очередям печати компьютера: одну очередь своего принтера оставляет и переводит на прямой IP-порт, её дубль удаляет, а WSD-очередь со сканером, USB-очередь, такой же принтер по другому адресу и общий принтер не трогает.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--bg1)"/>
      <stop offset="1" style="stop-color:var(--bg2)"/>
    </linearGradient>
  </defs>

  <style>
    /* Цикл 14 с: рамка проходит по очередям, у каждой появляется вердикт; затем дубль зачёркивается,
       а оставленная очередь переименовывается. Без анимации виден итог. Имена и адрес - выдуманные.
       Цвета - через переменные: светлая палитра по умолчанию, тёмная - по prefers-color-scheme. */
    :root {
      --bg1: #ffffff; --bg2: #f6f8fa; --border: #d0d7de; --row: #ffffff;
      --fg: #1f2328; --muted: #656d76; --icon: #8c959f;
      --red: #cf222e; --red-bg: #ffebe9; --green: #1a7f37; --green-bg: #dafbe1;
      --blue: #0969da; --scan: rgba(9, 105, 218, .08); --skip-bg: #eaeef2; --skip: #57606a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #0d1117; --bg2: #161b22; --border: #30363d; --row: #161b22;
        --fg: #e6edf3; --muted: #8b949e; --icon: #6e7681;
        --red: #ff7b72; --red-bg: #3c1618; --green: #3fb950; --green-bg: #12261e;
        --blue: #58a6ff; --scan: rgba(88, 166, 255, .10); --skip-bg: #21262d; --skip: #9ea7b3;
      }
    }

    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .name { fill: var(--fg); font-size: 14px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 12px; }
    .row { fill: var(--row); stroke: var(--border); }
    .icon { fill: none; stroke: var(--icon); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .badge text { font-size: 11.5px; font-weight: 700; letter-spacing: .6px; text-anchor: middle; }
    .keep rect { fill: var(--green-bg); stroke: var(--green); }
    .keep text { fill: var(--green); }
    .drop rect { fill: var(--red-bg); stroke: var(--red); }
    .drop text { fill: var(--red); }
    .skip rect { fill: var(--skip-bg); stroke: var(--border); }
    .skip text { fill: var(--skip); }

    .all { animation: all 14s linear infinite; }
    @keyframes all { 0% { opacity: 0 } 3%, 96% { opacity: 1 } 100% { opacity: 0 } }

    .scan { fill: var(--scan); stroke: var(--blue); stroke-width: 1.5; opacity: 0; animation: scan 14s ease-in-out infinite; }
    @keyframes scan {
      0%        { transform: translateY(0); opacity: 0 }
      4%, 12%   { transform: translateY(0); opacity: 1 }
      15%, 23%  { transform: translateY(44px) }
      26%, 34%  { transform: translateY(88px) }
      37%, 45%  { transform: translateY(132px) }
      48%, 56%  { transform: translateY(176px) }
      59%       { transform: translateY(220px) }
      67%       { transform: translateY(220px); opacity: 1 }
      71%, 100% { transform: translateY(220px); opacity: 0 }
    }

    .b0 { animation: b0 14s ease-out infinite; }
    .b1 { animation: b1 14s ease-out infinite; }
    .b2 { animation: b2 14s ease-out infinite; }
    .b3 { animation: b3 14s ease-out infinite; }
    .b4 { animation: b4 14s ease-out infinite; }
    .b5 { animation: b5 14s ease-out infinite; }
    @keyframes b0 { 0%, 7%  { opacity: 0; transform: translateX(10px) } 10%, 100% { opacity: 1; transform: translateX(0) } }
    @keyframes b1 { 0%, 18% { opacity: 0; transform: translateX(10px) } 21%, 100% { opacity: 1; transform: translateX(0) } }
    @keyframes b2 { 0%, 29% { opacity: 0; transform: translateX(10px) } 32%, 100% { opacity: 1; transform: translateX(0) } }
    @keyframes b3 { 0%, 40% { opacity: 0; transform: translateX(10px) } 43%, 100% { opacity: 1; transform: translateX(0) } }
    @keyframes b4 { 0%, 51% { opacity: 0; transform: translateX(10px) } 54%, 100% { opacity: 1; transform: translateX(0) } }
    @keyframes b5 { 0%, 62% { opacity: 0; transform: translateX(10px) } 65%, 100% { opacity: 1; transform: translateX(0) } }

    /* Итог: оставленная очередь получает новое имя, дубль зачёркивается */
    .old0 { opacity: 0; animation: old0 14s linear infinite; }
    .new0 { animation: new0 14s linear infinite; }
    @keyframes old0 { 0%, 74% { opacity: 1 } 77%, 100% { opacity: 0 } }
    @keyframes new0 { 0%, 76% { opacity: 0 } 80%, 100% { opacity: 1 } }

    .dim1 { opacity: .45; animation: dim1 14s linear infinite; }
    @keyframes dim1 { 0%, 76% { opacity: 1 } 81%, 100% { opacity: .45 } }
    .strike { stroke: var(--red); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 152;
              animation: strike 14s ease-out infinite; }
    @keyframes strike { 0%, 74% { stroke-dashoffset: 152 } 79%, 100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect x=".5" y=".5" width="839" height="371" rx="14" fill="url(#bg)" style="stroke:var(--border)"/>

  <rect x="32" y="24" width="60" height="26" rx="13" style="fill:var(--scan);stroke:var(--blue)"/>
  <text x="62" y="41.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" style="fill:var(--blue)">ПЛАН</text>
  <text x="104" y="43" font-size="16" font-weight="600" style="fill:var(--fg)">Что скрипт сделает с очередями на этом компьютере</text>

  <g class="all">
    <!-- Строки очередей: шаг 44 px -->
    <rect class="row" x="24" y="64"  width="792" height="36" rx="8"/>
    <rect class="row" x="24" y="108" width="792" height="36" rx="8"/>
    <rect class="row" x="24" y="152" width="792" height="36" rx="8"/>
    <rect class="row" x="24" y="196" width="792" height="36" rx="8"/>
    <rect class="row" x="24" y="240" width="792" height="36" rx="8"/>
    <rect class="row" x="24" y="284" width="792" height="36" rx="8"/>

    <rect class="scan" x="24" y="64" width="792" height="36" rx="8"/>

    <!-- Значки принтера -->
    <path class="icon" d="M44 79v-7h14v7M42 79h18v9H42zM46 85h10v5H46z"/>
    <path class="icon" d="M44 123v-7h14v7M42 123h18v9H42zM46 129h10v5H46z"/>
    <path class="icon" d="M44 167v-7h14v7M42 167h18v9H42zM46 173h10v5H46z"/>
    <path class="icon" d="M44 211v-7h14v7M42 211h18v9H42zM46 217h10v5H46z"/>
    <path class="icon" d="M44 255v-7h14v7M42 255h18v9H42zM46 261h10v5H46z"/>
    <path class="icon" d="M44 299v-7h14v7M42 299h18v9H42zM46 305h10v5H46z"/>

    <!-- 1. Оставить -->
    <g class="old0">
      <text class="name" x="72" y="80">Офисный принтер 0001</text>
      <text class="sub" x="72" y="94">порт на имя хоста · драйвер производителя</text>
    </g>
    <g class="new0">
      <text class="name" x="72" y="80">Офисный принтер (Wi-Fi)</text>
      <text class="sub" x="72" y="94">прямой порт IP_192.168.1.50 · RAW 9100</text>
    </g>
    <g class="badge keep b0">
      <rect x="574" y="70" width="230" height="24" rx="12"/>
      <text x="689" y="86.5">ОСТАВИТЬ · ПЕРЕВЕСТИ НА IP</text>
    </g>

    <!-- 2. Удалить -->
    <g class="dim1">
      <text class="name" x="72" y="124">Офисный принтер 0002</text>
      <text class="sub" x="72" y="138">порт на имя хоста · дубль той же очереди</text>
    </g>
    <path class="strike" d="M70 119.5H222"/>
    <g class="badge drop b1">
      <rect x="574" y="114" width="230" height="24" rx="12"/>
      <text x="689" y="130.5">УДАЛИТЬ · ДУБЛЬ</text>
    </g>

    <!-- 3. Не трогать: сканер -->
    <text class="name" x="72" y="168">PRINTER-1A2B3C (модель)</text>
    <text class="sub" x="72" y="182">WSD · через это же устройство работает сетевой сканер</text>
    <g class="badge skip b2">
      <rect x="574" y="158" width="230" height="24" rx="12"/>
      <text x="689" y="174.5">НЕ ТРОГАТЬ · СКАНЕР</text>
    </g>

    <!-- 4. Не трогать: USB -->
    <text class="name" x="72" y="212">Офисный принтер (USB)</text>
    <text class="sub" x="72" y="226">тот же принтер, подключённый кабелем</text>
    <g class="badge skip b3">
      <rect x="574" y="202" width="230" height="24" rx="12"/>
      <text x="689" y="218.5">НЕ ТРОГАТЬ · USB</text>
    </g>

    <!-- 5. Не трогать: другое устройство -->
    <text class="name" x="72" y="256">Такой же принтер, 2 этаж</text>
    <text class="sub" x="72" y="270">та же модель и драйвер, но другой IP-адрес</text>
    <g class="badge skip b4">
      <rect x="574" y="246" width="230" height="24" rx="12"/>
      <text x="689" y="262.5">НЕ ТРОГАТЬ · ДРУГОЙ ПРИНТЕР</text>
    </g>

    <!-- 6. Не трогать: общий принтер -->
    <text class="name" x="72" y="300">\\СЕРВЕР\Принтер бухгалтерии</text>
    <text class="sub" x="72" y="314">подключение к общему принтеру другого компьютера</text>
    <g class="badge skip b5">
      <rect x="574" y="290" width="230" height="24" rx="12"/>
      <text x="689" y="306.5">НЕ ТРОГАТЬ · ОБЩИЙ</text>
    </g>
  </g>

  <text x="420" y="350" text-anchor="middle" font-size="13" style="fill:var(--muted)">Меняются только сетевые очереди своего принтера. Перед изменениями — резервная копия.</text>
</svg>
